name: Deploy to Juno (Production)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        type: string

concurrency:
  group: juno-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Verify manual deployment confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "❌ Deployment not confirmed. Please type 'deploy' to proceed."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          check-lockfile: 'true'

      - name: Setup Juno CLI
        run: npm install -g @junobuild/cli

      - name: Configure Juno Environment
        run: |
          echo "JUNO_SATELLITE_ID=${{ secrets.JUNO_SATELLITE_ID_PROD }}" >> $GITHUB_ENV
          echo "JUNO_ENV=production" >> $GITHUB_ENV

      - name: Build for Juno (Production)
        run: npm run build:juno:prod --workspace=apps/ui
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL_PROD }}

      - name: Run pre-deployment checks
        run: |
          echo "Running pre-deployment checks..."
          # Add any checks here (e.g., tests, linting)
          cd apps/ui
          npm run typecheck
          echo "✅ Pre-deployment checks passed"

      - name: Deploy to Juno (Production)
        run: |
          cd apps/ui
          npx juno deploy --target production
        env:
          JUNO_TOKEN: ${{ secrets.JUNO_TOKEN }}

      - name: Verify deployment
        run: |
          echo "Verifying deployment..."
          SATELLITE_ID="${{ secrets.JUNO_SATELLITE_ID_PROD }}"
          URL="https://${SATELLITE_ID}.icp0.io"

          # Wait a few seconds for deployment to propagate
          sleep 10

          # Check if site is accessible (allow redirects)
          HTTP_STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")

          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "301" ] || [ "$HTTP_STATUS" = "302" ]; then
            echo "✅ Deployment verified - Site is accessible (HTTP $HTTP_STATUS)"
          else
            echo "⚠️ Deployment verification returned HTTP $HTTP_STATUS"
            echo "   This may be normal for ICP deployments. Please verify manually."
          fi

      - name: Update release notes
        if: github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const satelliteId = '${{ secrets.JUNO_SATELLITE_ID_PROD }}';
            const url = satelliteId 
              ? `https://${satelliteId}.icp0.io`
              : 'Deployment URL not available';

            const body = `🚀 **Deployed to Juno Production**\n\n` +
                        `URL: ${url}\n` +
                        `Satellite ID: ${satelliteId}\n\n` +
                        `---\n` +
                        `This release has been automatically deployed to the Internet Computer via Juno.build.`;

            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body: context.payload.release.body + '\n\n' + body
            });

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Successfully deployed to Juno Production"
          echo "Satellite ID: ${{ secrets.JUNO_SATELLITE_ID_PROD }}"
          echo "URL: https://${{ secrets.JUNO_SATELLITE_ID_PROD }}.icp0.io"
